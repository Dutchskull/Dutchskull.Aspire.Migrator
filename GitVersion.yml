mode: ContinuousDeployment
next-version: 10.0.0

branches:
  master:
    regex: ^master$
    label: ""
    increment: Minor

  develop:
    regex: ^develop$
    label: alpha
    increment: Minor

  feature:
    regex: ^features?[/-](?<BranchName>.+)$
    label: "{BranchName}"
    increment: Patch
    source-branches:
      - develop
      - main
